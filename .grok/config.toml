# Project Grok config — filesystem scope + safety
# New sessions: use profile dl2-scope (see sandbox.toml).
# Resume keeps the session's original profile; start a NEW session after changing this.

[sandbox]
profile = "dl2-scope"

[permission]
# Soft layer (model tools). Kernel enforcement is sandbox profile above.
# Do not open-home; do not trawl outside allowlist without asking user.
deny = [
  "Bash(find /home*)",
  "Bash(find ~*)",
  "Bash(find /root*)",
  "Bash(rg * /home/*)",
  "Bash(rg * /home/malware/*)",
  "Read(/home/malware/.ssh/**)",
  "Read(/home/malware/.gnupg/**)",
  "Edit(/home/malware/.ssh/**)",
]
